apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-devops-web
  namespace: default
spec:
  selector:
    app: {{ .Release.Name }}-devops-web
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
  type: {{ .Values.service.type }}
