---
- name: Install and configure Docker on worker nodes
  hosts: workers
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Add gopala to docker group
      user:
        name: gopala
        groups: docker
        append: true

    - name: Verify Docker service
      command: systemctl is-active docker
      register: docker_status
      changed_when: false

    - name: Display Docker service status
      debug:
        msg: "Docker service status: {{ docker_status.stdout }}"
